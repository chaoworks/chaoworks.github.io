layout: default
title: ChaoWorks
lang: en
body_class: language-gateway
---

<main class="gateway" aria-labelledby="gateway-title">
  <p class="eyebrow">CHAOWORKS · ENGINEERING NOTES</p>
  <h1 id="gateway-title">Choose your reading language</h1>
  <p>正在根据你的浏览器语言打开博客。You can always switch languages from the navigation.</p>
  <div class="gateway-actions">
    <a class="button button-primary" href="{{ '/zh/' | relative_url }}" data-language-choice="zh">中文</a>
    <a class="button" href="{{ '/en/' | relative_url }}" data-language-choice="en">English</a>
  </div>
</main>
<script>
  (function(){var saved=localStorage.getItem('chaoworks-language');var preferred=saved||((navigator.languages||[navigator.language||'en'])[0].toLowerCase().startsWith('zh')?'zh':'en');window.location.replace('{{ site.baseurl }}'+(preferred==='zh'?'/zh/':'/en/'));})();
</script>
