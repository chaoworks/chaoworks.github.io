{% assign measurement_id = site.google_analytics | default: '' | strip %}
{% if jekyll.environment == 'production' and measurement_id != '' and page.analytics != false %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ measurement_id | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', {{ measurement_id | jsonify }}, {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>
{% endif %}
